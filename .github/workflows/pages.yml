name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ai/requirements.txt
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install AI export toolchain
        run: python -m pip install -r scripts/ai/requirements.txt
      - name: Build and verify AI model
        run: |
          mkdir -p web/public/models
          python scripts/ai/export_realesrgan_general_x4v3.py \
            --output web/public/models/realesr-general-x4v3.onnx \
            --metadata web/public/models/realesr-general-x4v3.json
      - name: Test
        run: npm test
      - name: Static checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
