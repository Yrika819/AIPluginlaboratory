name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Static checks
        run: npm run check
      - name: Production build
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  runtime-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lockfile:
    name: Commit dependency lock
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when missing or changed
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  production-bundle:
    name: Production bundle
    needs:
      - verify
      - browser-e2e
      - runtime-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbench-production
          path: dist/
          if-no-files-found: error
          retention-days: 30
