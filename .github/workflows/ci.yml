name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Static checks
        run: npm run check
      - name: Production build
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  runtime-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ai-model:
    name: Build and verify AI model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ai/requirements.txt
      - name: Install pinned export toolchain
        run: python -m pip install -r scripts/ai/requirements.txt
      - name: Export and numerically verify ONNX
        run: |
          python scripts/ai/export_realesrgan_general_x4v3.py \
            --output ai-model/realesr-general-x4v3.onnx \
            --metadata ai-model/realesr-general-x4v3.json
      - name: Verify exported digests
        run: sha256sum ai-model/*
      - uses: actions/upload-artifact@v7
        with:
          name: pocketbench-ai-model
          path: ai-model/
          if-no-files-found: error
          retention-days: 30

  ai-browser-e2e:
    name: AI Browser E2E
    needs:
      - ai-model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download verified AI model
        uses: actions/download-artifact@v7
        with:
          name: pocketbench-ai-model
          path: web/public/models
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build with AI model
        run: npm run build
      - name: Real ONNX browser inference tests
        run: npx playwright test --config playwright.ai.config.mjs
      - name: Upload AI Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ai-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lockfile:
    name: Refresh npm dependency lock
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ai-upscale-v0.3'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh npm lock for AI upscale"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  production-bundle:
    name: Production bundle
    needs:
      - verify
      - browser-e2e
      - runtime-audit
      - ai-model
      - ai-browser-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download verified AI model
        uses: actions/download-artifact@v7
        with:
          name: pocketbench-ai-model
          path: web/public/models
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: pocketbench-production
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - production-bundle
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download exact tested production bundle
        uses: actions/download-artifact@v7
        with:
          name: pocketbench-production
          path: dist
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package release
        shell: bash
        run: |
          ARCHIVE="pocketbench-web-v${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -qr "../$ARCHIVE" .)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ARCHIVE="pocketbench-web-v$VERSION.zip"
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --target "$GITHUB_SHA" \
              --title "PocketBench $TAG" \
              --generate-notes \
              $PRERELEASE
          fi
