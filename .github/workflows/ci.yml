name: CI

on:
  push:
    branches:
      - main
      - "experiment/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test
        run: npm test
      - name: Static checks
        run: npm run check
      - name: Production build
        run: npm run build

  release-bundle:
    name: Production bundle
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbench-production
          path: dist/
          if-no-files-found: error
          retention-days: 30
