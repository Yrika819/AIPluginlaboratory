name: AI Model PoC

on:
  push:
    branches:
      - "feature/ai-upscale-v0.3"
    paths:
      - "scripts/ai/**"
      - ".github/workflows/ai-model-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 onnx==1.23.0 onnxruntime==1.30.0 numpy==2.3.3
      - name: Export official Real-ESRGAN model to ONNX
        run: |
          python scripts/ai/export_realesrgan_general_x4v3.py \
            --output ai-artifacts/realesr-general-x4v3.onnx \
            --metadata ai-artifacts/realesr-general-x4v3.json
      - name: Show model files
        run: |
          ls -lh ai-artifacts
          sha256sum ai-artifacts/*
      - uses: actions/upload-artifact@v7
        with:
          name: realesr-general-x4v3-onnx-poc
          path: ai-artifacts/
          if-no-files-found: error
          retention-days: 30
